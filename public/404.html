<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jalsetu – Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect to home with hash
      var segment = window.location.pathname.split('/')[1] || '';
      var basePath = segment ? '/' + segment + '/' : '/';
      window.location.replace(basePath);
    </script>
  </head>
  <body>
    <p>Redirecting to Jalsetu...</p>
  </body>
</html>
